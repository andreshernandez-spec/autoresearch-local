[project]
name = "autoresearch-local"
version = "0.2.0"
description = "A local harness for automated research: frozen evaluation, a git ledger, code tracks, a periodic introspection."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 140

[tool.pyright]
extraPaths = ["src", "tests"]
